[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartgrid"
version = "1.0.0"
description = "Hybrid CNN-LSTM pipeline for energy consumption forecasting using BDG2 data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core data processing
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pyarrow==16.1.0",
    "python-dateutil==2.9.0.post0",
    "tzdata==2024.1",
    # Data ingestion
    "requests==2.32.3",
    "tqdm==4.66.4",
    # Machine learning
    "tensorflow==2.15.*",
    "scikit-learn==1.4.2",
    "scipy==1.12.0",
    "joblib>=1.3.0",
    # Visualization
    "matplotlib==3.8.4",
    # System monitoring
    "psutil==5.9.8",
    "gputil==1.4.0",
    # Dashboard
    "streamlit==1.33.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
]
gpu = [
    "cudf-cu12==24.06.*",
    "cupy-cuda12x",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "gpu: marks tests that require GPU (deselect with '-m \"not gpu\"')",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
